; Dialplan of the test PBX.
[general]
static=yes
writeprotect=yes

[tests]
; 600: echo, for RTP checks
exten => 600,1,Answer()
 same => n,Echo()

; 601: answers, then sends DTMF 123 and hangs up
exten => 601,1,Answer()
 same => n,Wait(1)
 same => n,SendDTMF(123)
 same => n,Wait(2)
 same => n,Hangup()

; 602: busy
exten => 602,1,Busy(5)

; 1001, 1002: each other's phones, with hints for presence and BLF
exten => 1001,hint,PJSIP/1001
exten => 1002,hint,PJSIP/1002
exten => _100X,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
