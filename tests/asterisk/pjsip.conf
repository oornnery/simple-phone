; Test PBX for tests/test_asterisk.py: extensions 1001 and 1002, password "secret".
[global]
type=global
user_agent=simple-phone-test-pbx

[udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[endpoint](!)
type=endpoint
context=tests
disallow=all
allow=alaw,ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[auth](!)
type=auth
auth_type=userpass
password=secret

[aor](!)
type=aor
max_contacts=1
remove_existing=yes

[1001](endpoint)
auth=1001
aors=1001
mailboxes=1001@default
[1001](auth)
username=1001
[1001](aor)

[1002](endpoint)
auth=1002
aors=1002
[1002](auth)
username=1002
[1002](aor)
