name: release

# Push a tag v<version> (the version in pyproject.toml): the manylinux
# wheels are built, tested (unit and PJSUA2 tests on each wheel) and
# published to PyPI. The commit already passed ci.yml on main, so CI does not
# run again here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build and test the wheels without publishing

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false # one OS failing must not cancel the other
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_package.py --metadata --tag "$GITHUB_REF_NAME"
      - uses: pypa/cibuildwheel@v4.3.5
      - name: Wheel contents
        run: python scripts/check_package.py wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: wheels
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing: no token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
