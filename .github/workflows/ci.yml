name: ci

# Run it locally first: bash scripts/ci.sh does the same steps.
on:
  push:
    branches: [main]
    paths-ignore: # text only: run bash scripts/check.sh locally instead
      - "**.md"
      - "docs/**"
      - "examples/api/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/api/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: each job is billed rounded up to the minute, and check.sh
  # already runs ruff and ty.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Native build requirements
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config swig libasound2-dev
      - name: Cache PJSIP and the SWIG wrapper
        uses: actions/cache@v4
        with:
          path: |
            build/pjsip
            src/simple_phone/_native/_build.py
            src/simple_phone/_native/pjsua2.py
            src/simple_phone/_native/pjsua2_wrap.cpp
            src/simple_phone/_native/pjsua2_wrap.h
          key: pjsip-${{ runner.os }}-${{ hashFiles('scripts/build_pjsip.sh', 'packaging/config_site.h', 'packaging/pjsua2_extra.i') }}
      - name: Development environment
        run: bash scripts/dev.sh --python 3.14
      - name: Ruff, ty, metadata and unit tests
        run: bash scripts/check.sh
      - name: PJSUA2 integration on localhost
        run: bash scripts/test.sh --native
      - name: Start Asterisk (Docker)
        run: bash scripts/asterisk.sh
      - name: Tests against Asterisk
        env:
          ASTERISK_HOST: 127.0.0.1
        run: .venv/bin/python -m unittest discover -s tests -t tests -p 'test_asterisk.py' -v
      - name: Asterisk log
        if: failure()
        run: docker logs simple-phone-asterisk | tail -100
